<style>
        /* 全体の背景と文字の設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f0e6; /* 落ち着いた薄ベージュ */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        /* 絵本の外枠（ステージ） */
        .book-container {
            width: 100%;
            max-width: 480px;
            height: 660px; /* 少し高さを出してゆとりを持たせたわ */
            position: relative;
            perspective: 2000px;
        }

        /* 各ページ共通のスタイル */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 10px;
            padding: 25px 25px 15px 25px; /* 下側の余白を調整 */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 上下に綺麗に配分 */
            align-items: center;
            text-align: center;
            
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: left center;
            backface-visibility: hidden;
            z-index: 1;
        }

        .page.active {
            z-index: 10;
            transform: rotateY(0deg);
        }

        .page.flipped {
            transform: rotateY(-180deg);
            z-index: 5;
            pointer-events: none;
        }

        /* ──── 【ここを修正して画像サイズを柔軟にしたわ】 ──── */
        /* 挿絵が入るエリア */
        .illustration {
            width: 100%;
            height: 280px; /* 固定高さを少し控えめにしてスペースを確保 */
            max-height: 45vh; /* 画面サイズに合わせて縮むように */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            background-color: #f9f6f0;
            flex-shrink: 0; /* 潰れないように固定 */
        }
        .illustration img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 文章のスタイル */
        .story-text {
            font-size: 15px;
            line-height: 1.6;
            margin: 15px 0;
            flex-grow: 1; /* 余ったスペースを文章が使う */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ──── 【ノンブルをしっかり固定して目立たせたわ】 ──── */
        /* ページ番号（ノンブル）のスタイル */
        .page-number {
            font-size: 13px;
            color: #888;
            font-weight: bold;
            margin: 5px 0 10px 0; /* 位置を少し上げてボタンの上に固定 */
            flex-shrink: 0;
        }

        /* ボタンのスタイル */
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #88b04b;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .btn:hover { background-color: #77a03c; }
        .btn.back { background-color: #aaa; }
        .btn.back:hover { background-color: #999; }

        .button-group {
            display: flex;
            gap: 15px;
            flex-shrink: 0;
        }

        /* 表紙専用の装飾 */
        .cover {
            background-color: #edf3f5;
            border-left: 8px solid #5a8da3;
        }
        .cover h1 { font-size: 28px; color: #2c5270; margin-top: 20px; }
    </style>
