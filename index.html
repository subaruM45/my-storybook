<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしの絵本（めくり動作修正版）</title>
    <style>
        /* 全体の背景と文字の設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fcfaf2; /* 優しい紙の色 */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 絵本の外枠（ステージ） */
        .book-container {
            width: 100%;
            max-width: 500px;
            height: 650px;
            position: relative;
            /* 3D効果の奥行き（この数値を少し大きくして、めくる立体感を綺麗にしました） */
            perspective: 2000px; 
        }

        /* 各ページ共通のスタイル */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            
            /* アニメーションのスムーズな設定 */
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: left center; /* 左端を本の中心（軸）にしてめくる */
            backface-visibility: hidden; /* 裏返った面を完全に見えなくする（超重要！） */
            
            /* 初期状態の重なり順（基本はすべて下に重ねておく） */
            z-index: 1;
        }

        /* ──── 【ここが修正ポイントよ！】 ──── */
        /* 今見えている（アクティブな）ページは、一番上に表示する */
        .page.active {
            z-index: 10;
            transform: rotateY(0deg);
        }

        /* めくられて左側に「去っていった」ページ */
        .page.flipped {
            transform: rotateY(-180deg);
            z-index: 5; /* activeよりは下だけど、これから現れる次のページよりは上にする */
            pointer-events: none;
        }
        /* ────────────────────────────────── */

        /* 挿絵が入るエリア */
        .illustration {
            width: 100%;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .illustration img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 文章のスタイル */
        .story-text {
            font-size: 16px;
            line-height: 1.8;
            margin: 15px 0;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ボタンのスタイル */
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #88b04b;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        .btn:hover { background-color: #77a03c; }
        .btn.back { background-color: #aaa; }
        .btn.back:hover { background-color: #999; }

        .button-group {
            display: flex;
            gap: 15px;
        }

        /* 表紙専用の装飾 */
        .cover {
            background-color: #e8f4f8;
            border-left: 8px solid #5a8da3;
        }
        .cover h1 { font-size: 28px; color: #2c5270; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="book-container">

        <div class="page cover active" id="p0">
            <h1>そらのバルーン船</h1>
            <div class="illustration">
                <img src="https://picsum.photos/id/1016/500/350" alt="表紙イラスト">
            </div>
            <p class="story-text">さく・え：つっきぃ</p>
            <button class="btn" onclick="nextPage(0)">ほんを よむ</button>
        </div>

        <div class="page" id="p1">
            <div class="illustration">
                <img src="https://picsum.photos/id/1021/500/350" alt="1ページ目イラスト">
            </div>
            <p class="story-text">
                むかしむかし、あるところに、ちいさなネズミのきょうだいがいました。<br>
                きょうだいは、まあるい風船の船にのって、遠い北の街へ旅にでることにしました。
            </p>
            <div class="button-group">
                <button class="btn back" onclick="prevPage(1)">もどる</button>
                <button class="btn" onclick="nextPage(1)">つぎへ</button>
            </div>
        </div>

        <div class="page" id="p2">
            <div class="illustration">
                <img src="https://picsum.photos/id/1043/500/350" alt="2ページ目イラスト">
            </div>
            <p class="story-text">
                冷たい風がふいてきましたが、風船の船はふわふわと進みます。<br>
                「お星さまが近くに見えるね！」ときょうだいは大喜びです。
            </p>
            <div class="button-group">
                <button class="btn back" onclick="prevPage(2)">もどる</button>
                <button class="btn" onclick="goToCover()">はじめから読む</button>
            </div>
        </div>

    </div>

    <script>
        function nextPage(currentPageId) {
            const currentPage = document.getElementById('p' + currentPageId);
            const nextPage = document.getElementById('p' + (currentPageId + 1));
            
            if (currentPage) {
                // 今のページを「めくられた状態」にする
                currentPage.classList.add('flipped');
                currentPage.classList.remove('active');
            }
            if (nextPage) {
                // 次のページを「一番上の見える状態」にする
                nextPage.classList.add('active');
            }
        }

        function prevPage(currentPageId) {
            const currentPage = document.getElementById('p' + currentPageId);
            const prevPage = document.getElementById('p' + (currentPageId - 1));
            
            if (currentPage) {
                currentPage.classList.remove('active');
            }
            if (prevPage) {
                // 前のページの「めくられた状態」を解除して、一番上に戻す
                prevPage.classList.remove('flipped');
                prevPage.classList.add('active');
            }
        }

        function goToCover() {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.remove('flipped');
                page.classList.remove('active');
            });
            document.getElementById('p0').classList.add('active');
        }
    </script>

</body>
</html>
