<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしの絵本</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fcfaf2; /* 優しい紙の色 */
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 { font-size: 24px; color: #555; }
        p { font-size: 18px; line-height: 1.8; margin: 20px 0; }
        .next-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #88b04b;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>タイトル：そらのバルーン</h1>
        
        <!-- ここに絵本の文章を書くわよ -->
        <p>むかしむかし、あるところに、ちいさなネズミのきょうだいがいました。<br>
        きょうだいは、まあるい風船にのって旅にでることにしました。</p>
        
        <!-- 次のページへのリンク（今はまだ動かなくてOK） -->
        <a href="#" class="next-btn">つぎへ</a>
    </div>

</body>
</html>
